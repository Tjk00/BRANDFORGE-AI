# Cloudflare Pages configuration.
# Build command: npm run build:client
# Build output directory: dist
# The API lives in functions/api/[[path]].ts and is deployed automatically.
name = "brandforge-ai"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

[vars]
APP_NAME = "BRANDFORGE AI"

# Optional AI provider (leave unset to use the built-in deterministic engines):
#   npx wrangler pages secret put AI_API_KEY
#   npx wrangler pages secret put AI_BASE_URL
#   npx wrangler pages secret put AI_MODEL
